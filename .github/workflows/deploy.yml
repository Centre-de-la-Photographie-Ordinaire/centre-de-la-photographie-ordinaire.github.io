name: deploy to github pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# unique ligne differenciante entre les deux repos (website-draft vs .github.io)
env:
  HUGO_BASE_URL: "https://centre-de-la-photographie-ordinaire.github.io/"

permissions:
  contents: read
  pages: write
  id-token: write

# un seul déploiement à la fois ; un push plus récent remplace celui en cours
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          set -eux
          HUGO_VERSION=0.159.0
          wget -qO /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xf /tmp/hugo.tar.gz -C /tmp hugo
          /tmp/hugo version
      - name: Build
        run: /tmp/hugo build --minify --baseURL "${HUGO_BASE_URL}" --destination public
      # dépôt d'artefact Pages (remplace le push force sur gh-pages).
      # Pourquoi : la réplique pèse ~120 Mo (collection + diaporama + vidéos) ;
      # pousser une branche à chaque commit faisait re-synchroniser ce poids
      # entier par le service Pages, qui restait bloqué en « syncing_files »
      # et dépassait le délai de 10 min (runs 42800936315 et 42804215437).
      # L'artefact, lui, n'est déployé qu'une fois et le service Pages ne fait
      # plus de diff de branche.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
